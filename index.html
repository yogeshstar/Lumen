<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#1a1a1f;--mute:#8a8a94;--line:#ececf0;--like:#ff2e63;--chip:#f3f3f6;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d11;--fg:#f4f4f7;--mute:#8c8c98;--line:#25252d;--chip:#1b1b22}}
:root[data-theme="dark"]{--bg:#0d0d11;--fg:#f4f4f7;--mute:#8c8c98;--line:#25252d;--chip:#1b1b22}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--like);outline-offset:2px}
#app{width:100%;max-width:470px;height:100%;display:flex;flex-direction:column;position:relative;border-inline:1px solid var(--line);overflow:hidden}
header{padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.hr{display:flex;gap:18px}.hr button{position:relative}
#bd,#nb{position:absolute;top:-6px;right:-8px;background:var(--like);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
#bd:empty,#nb:empty{display:none}
.wm{font-family:Outfit,"Segoe UI",system-ui,sans-serif;font-weight:600;font-size:30px;letter-spacing:-.02em;display:inline-flex;align-items:flex-end;line-height:1}
.wm i{width:.14em;height:.76em;margin-right:.07em;border-radius:.1em;background:linear-gradient(180deg,#ffb347,#ff2e63);box-shadow:0 0 .4em rgba(255,46,99,.55)}
.wm.big{display:flex;justify-content:center;font-size:58px;margin-bottom:8px}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow-y:auto;overscroll-behavior:contain}
nav{display:flex;justify-content:space-around;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--line)}
nav button{padding:4px 18px;opacity:.55}
nav button[aria-current="true"]{opacity:1}
nav button[aria-current="true"] .ic{stroke-width:2.6}
.av{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--mute);flex:none}
.ring{width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#ff9a3c,#ff2e63,#a63cff,#ff9a3c)}
.ring.seen{background:var(--line)}
.ring .av{border:3px solid var(--bg)}
.post{padding-bottom:8px;border-bottom:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px}
.ph b{font-size:14px;display:block}.ph small{color:var(--mute);font-size:12px}
.ph .who{display:flex;align-items:center;gap:10px;text-align:left}
.more{margin-left:auto;color:var(--mute)}.more.arm{color:var(--like);font-size:13px;font-weight:600}
.more .ic{width:22px;height:22px}
.art{position:relative;aspect-ratio:1;background:#000;overflow:hidden;display:grid;place-items:center}
.art.reel{aspect-ratio:9/16;max-height:72vh}
.art img,.art video{width:100%;height:100%;object-fit:cover;display:block}
.heart{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.heart svg{width:110px;height:110px;fill:#fff;opacity:0;transform:scale(.4);filter:drop-shadow(0 4px 16px rgba(0,0,0,.35))}
.heart.pop svg{animation:pop .8s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}50%{transform:scale(.95)}100%{opacity:0;transform:scale(1.05)}}
.act{display:flex;gap:16px;padding:10px 14px 4px}
.like.on .ic{fill:var(--like);stroke:var(--like)}
.meta{padding:0 14px;font-size:14px;line-height:1.45}.meta .cap b{margin-right:6px}
.cm{padding:6px 14px 0}.cm p{font-size:14px;margin:3px 0}.cm b{margin-right:6px}
.add{display:flex;gap:8px;padding:8px 14px 0}
.add input,.cb input{flex:1;background:none;border:0;color:var(--fg);font:inherit;font-size:14px;padding:6px 0}
.add button,.cb button{color:#3b7bff;font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tl{position:relative;aspect-ratio:1;background:#000;overflow:hidden}
.tl img,.tl video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tl .pl{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.tl .pl .ic{width:20px;height:20px;stroke:none}
.search{padding:10px 14px}
.search input,.fld input,.new textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;font-size:15px}
.search input{border:0}
.sech{padding:8px 14px 2px;font-size:13px;font-weight:600;color:var(--mute)}
.pr{display:flex;align-items:center;gap:12px;padding:8px 14px;width:100%;text-align:left}
.pr .pi{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.pr .av{width:44px;height:44px}.pr b{display:block;font-size:14px}.pr small{color:var(--mute);font-size:12px}
.pr .t{flex:1;min-width:0}.pr .t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--like)}
.fb{background:var(--like);color:#fff;font-weight:700;font-size:13px;padding:7px 18px;border-radius:9px;display:inline-block;cursor:pointer}
.fb.ghost{background:var(--chip);color:var(--fg)}
.sg{padding:14px 0 6px;border-bottom:1px solid var(--line)}
.sgh{padding:0 16px 10px;font-size:14px}
.sgl{display:flex;gap:10px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.sgl::-webkit-scrollbar{display:none}
.sc{position:relative;flex:none;width:150px;border:1px solid var(--line);border-radius:14px;padding:16px 10px 12px;text-align:center}
.sc .pi{display:block;width:100%}
.sc .av{width:64px;height:64px;margin:0 auto 8px}
.sc b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.sc small{display:block;color:var(--mute);font-size:11px;margin:2px 0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx{position:absolute;top:4px;right:8px;color:var(--mute);font-size:18px}
.empty{padding:36px 28px;text-align:center}.empty b{font-size:17px;display:block;margin-bottom:6px}.empty p{color:var(--mute);font-size:14px;margin-bottom:14px}
.prof{padding:18px 16px}.prof .top{display:flex;align-items:center;gap:22px}
.prof .ring{width:86px;height:86px;flex:none}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px}.stats span{font-size:13px;color:var(--mute)}
.prof h2{font-size:15px;margin-top:12px}.prof p{font-size:14px;margin-top:2px;line-height:1.4}
.btns{display:flex;gap:8px;margin:14px 0 0}
.btns button{flex:1;padding:8px;border-radius:10px;background:var(--chip);font-weight:600;font-size:14px}
.btns .pri{background:var(--like);color:#fff}
.ptabs,.seg{display:flex}
.ptabs{border-top:1px solid var(--line)}
.ptabs button{flex:1;padding:12px;font-size:14px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent}
.ptabs button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.new{padding:16px}
.seg{background:var(--chip);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.new .art{border-radius:14px;margin-bottom:12px}
.drop{display:block;text-align:center;padding:16px;border:1.5px dashed var(--mute);border-radius:14px;font-weight:600;font-size:14px;margin-bottom:12px;cursor:pointer}
.new textarea{min-height:90px;resize:none;margin-bottom:12px}
.cta{width:100%;padding:13px;border-radius:12px;background:var(--like);color:#fff;font-weight:700;font-size:15px;display:flex;justify-content:center;align-items:center;min-height:46px}
.cta:disabled{opacity:.75}
.ov{position:absolute;inset:0;z-index:16;background:var(--bg);display:none;flex-direction:column}
.ov.open{display:flex}
.ovh{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;border-bottom:1px solid var(--line)}
.ovb{flex:1;overflow-y:auto;padding-bottom:8px}
.bub{max-width:75%;width:fit-content;padding:9px 13px;border-radius:18px;margin:4px 14px;font-size:14px;line-height:1.35;background:var(--chip);overflow-wrap:anywhere}
.bub.me{margin-left:auto;background:var(--like);color:#fff}
.cb{display:flex;gap:10px;align-items:center;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--line)}
.cb input{background:var(--chip);border-radius:20px;padding:10px 14px}
.sh{padding:6px 16px 16px}.shp{text-align:center;margin:14px 0 18px}
.shp .av{width:96px;height:96px;margin:0 auto 12px}
.shp .rm{display:block;margin:10px auto 0;color:var(--mute);font-size:13px}
.sv2{color:var(--like);font-weight:700}.fld{position:relative;margin-bottom:10px}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:13px;font-weight:600}
.toast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.canc{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:20px;font-size:15px;font-weight:600}
.stats button{text-align:center;cursor:pointer}
.pr.nw{background:var(--chip)}
.stories{display:flex;gap:14px;padding:12px 14px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{position:relative;flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:5px}
.stb{display:block}
.st span{font-size:12px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plus{position:absolute;top:46px;left:46px;width:22px;height:22px;border-radius:50%;background:#3b7bff;color:#fff;border:2px solid var(--bg);font-size:15px;font-weight:700;line-height:1;display:grid;place-items:center}
label.pr{cursor:pointer}
.sv{position:absolute;inset:0;z-index:17;background:#000;color:#fff;display:none;flex-direction:column}
.sv.open{display:flex}
.svb{flex:1;position:relative;display:grid;place-items:center;overflow:hidden}
.svb img,.svb video{width:100%;height:100%;object-fit:contain}
.sv .bars{display:flex;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;position:absolute;left:0;right:0;top:0;z-index:3}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff}
.bars i.done b{width:100%}
.svh{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:0;right:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:600;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.svh .av{width:34px;height:34px}
.svh .x{margin-left:auto;font-size:28px;line-height:1}
.svh .dl{margin-left:auto}.svh .dl+.x{margin-left:6px}
.svn{position:absolute;inset:0;display:flex;z-index:1}
.svn button{flex:1}
.svc{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);left:0;right:0;text-align:center;padding:0 20px;z-index:2;font-size:16px;text-shadow:0 1px 8px rgba(0,0,0,.7);pointer-events:none}
.th{width:44px;height:44px;border-radius:6px;overflow:hidden;background:#000;flex:none}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ptabs button{font-size:13px;padding:12px 4px}
.auth{position:absolute;inset:0;z-index:15;background:var(--bg);overflow-y:auto;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 56px) 28px 24px}
.auth.open{display:flex}
.tag2{text-align:center;color:var(--mute);font-size:14px;margin-bottom:24px;line-height:1.4}
.fld input.bad{border-color:var(--like)}
.err{color:var(--like);font-size:13px;min-height:20px;margin:2px 0 8px;line-height:1.35}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.swap{text-align:center;font-size:14px;margin-top:20px;color:var(--mute)}.swap button{color:var(--like);font-weight:700}
.splash{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(160deg,#ff9a3c,#ff2e63 55%,#a63cff);color:#fff;transition:opacity .5s,visibility .5s}
.splash.out{opacity:0;visibility:hidden}
.sp-mid{text-align:center}
.sp-name.wm{font-size:68px;animation:sp-up .7s .2s both}
.splash .wm i{background:#fff;box-shadow:0 0 .5em rgba(255,255,255,.9);animation:lit 1.4s .8s ease-in-out infinite}
.sp-bar{width:120px;height:3px;margin:22px auto 0;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sp-bar::after{content:"";display:block;height:100%;width:40%;background:#fff;border-radius:2px;animation:sp-load 1.1s ease-in-out infinite}
@keyframes sp-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sp-load{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@keyframes lit{50%{box-shadow:0 0 .9em #fff;transform:scaleY(1.06)}}
@media (prefers-reduced-motion:reduce){.sp-name.wm,.splash .wm i,.sp-bar::after,.spin,.heart.pop svg{animation:none}}
</style>
</head>
