<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#1a1a1f;--mute:#8a8a94;--line:#ececf0;--like:#ff2e63;--chip:#f3f3f6;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d11;--fg:#f4f4f7;--mute:#8c8c98;--line:#25252d;--chip:#1b1b22}}
:root[data-theme="dark"]{--bg:#0d0d11;--fg:#f4f4f7;--mute:#8c8c98;--line:#25252d;--chip:#1b1b22}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--like);outline-offset:2px}
#app{width:100%;max-width:470px;height:100%;display:flex;flex-direction:column;position:relative;border-inline:1px solid var(--line);overflow:hidden}
header{padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.hr{display:flex;gap:18px}.hr button{position:relative}
#bd{position:absolute;top:-6px;right:-8px;background:var(--like);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
#bd:empty{display:none}
.wm{font-family:Outfit,"Segoe UI",system-ui,sans-serif;font-weight:600;font-size:30px;letter-spacing:-.02em;display:inline-flex;align-items:flex-end;line-height:1}
.wm i{width:.14em;height:.76em;margin-right:.07em;border-radius:.1em;background:linear-gradient(180deg,#ffb347,#ff2e63);box-shadow:0 0 .4em rgba(255,46,99,.55)}
.wm.big{display:flex;justify-content:center;font-size:58px;margin-bottom:8px}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow-y:auto;overscroll-behavior:contain}
nav{display:flex;justify-content:space-around;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--line)}
nav button{padding:4px 18px;opacity:.55}
nav button[aria-current="true"]{opacity:1}
nav button[aria-current="true"] .ic{stroke-width:2.6}
.av{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--mute);flex:none}
.ring{width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#ff9a3c,#ff2e63,#a63cff,#ff9a3c)}
.ring.seen{background:var(--line)}
.ring .av{border:3px solid var(--bg)}
.post{padding-bottom:8px;border-bottom:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px}
.ph b{font-size:14px;display:block}.ph small{color:var(--mute);font-size:12px}
.more{margin-left:auto;color:var(--mute)}.more.arm{color:var(--like);font-size:13px;font-weight:600}
.more .ic{width:22px;height:22px}
.art{position:relative;aspect-ratio:1;background:#000;overflow:hidden;display:grid;place-items:center}
.art.reel{aspect-ratio:9/16;max-height:72vh}
.art img,.art video{width:100%;height:100%;object-fit:cover;display:block}
.heart{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.heart svg{width:110px;height:110px;fill:#fff;opacity:0;transform:scale(.4);filter:drop-shadow(0 4px 16px rgba(0,0,0,.35))}
.heart.pop svg{animation:pop .8s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}50%{transform:scale(.95)}100%{opacity:0;transform:scale(1.05)}}
.act{display:flex;gap:16px;padding:10px 14px 4px}
.like.on .ic{fill:var(--like);stroke:var(--like)}
.meta{padding:0 14px;font-size:14px;line-height:1.45}.meta .cap b{margin-right:6px}
.cm{padding:6px 14px 0}.cm p{font-size:14px;margin:3px 0}.cm b{margin-right:6px}
.add{display:flex;gap:8px;padding:8px 14px 0}
.add input,.cb input{flex:1;background:none;border:0;color:var(--fg);font:inherit;font-size:14px;padding:6px 0}
.add button,.cb button{color:#3b7bff;font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tl{position:relative;aspect-ratio:1;background:#000;overflow:hidden}
.tl img,.tl video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tl .pl{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.tl .pl .ic{width:20px;height:20px;stroke:none}
.search{padding:10px 14px}
.search input,.fld input,.new textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;font-size:15px}
.search input{border:0}
.pr{display:flex;align-items:center;gap:12px;padding:8px 14px;width:100%;text-align:left}
.pr .av{width:44px;height:44px}.pr b{display:block;font-size:14px}.pr small{color:var(--mute);font-size:12px}
.pr .t{flex:1;min-width:0}.pr .t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--like)}
.fb{background:var(--like);color:#fff;font-weight:700;font-size:13px;padding:7px 18px;border-radius:9px;display:inline-block;cursor:pointer}
.fb.ghost{background:var(--chip);color:var(--fg)}
.sg{padding:14px 0 6px;border-bottom:1px solid var(--line)}
.sgh{padding:0 16px 10px;font-size:14px}
.sgl{display:flex;gap:10px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.sgl::-webkit-scrollbar{display:none}
.sc{position:relative;flex:none;width:150px;border:1px solid var(--line);border-radius:14px;padding:16px 10px 12px;text-align:center}
.sc .av{width:64px;height:64px;margin:0 auto 8px}
.sc b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.sc small{display:block;color:var(--mute);font-size:11px;margin:2px 0 10px}
.sx{position:absolute;top:4px;right:8px;color:var(--mute);font-size:18px}
.empty{padding:36px 28px;text-align:center}.empty b{font-size:17px;display:block;margin-bottom:6px}.empty p{color:var(--mute);font-size:14px;margin-bottom:14px}
.prof{padding:18px 16px}.prof .top{display:flex;align-items:center;gap:22px}
.prof .ring{width:86px;height:86px;flex:none}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px}.stats span{font-size:13px;color:var(--mute)}
.prof h2{font-size:15px;margin-top:12px}.prof p{font-size:14px;margin-top:2px;line-height:1.4}
.btns{display:flex;gap:8px;margin:14px 0 0}
.btns button{flex:1;padding:8px;border-radius:10px;background:var(--chip);font-weight:600;font-size:14px}
.btns .pri{background:var(--like);color:#fff}
.ptabs,.seg{display:flex}
.ptabs{border-top:1px solid var(--line)}
.ptabs button{flex:1;padding:12px;font-size:14px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent}
.ptabs button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.new{padding:16px}
.seg{background:var(--chip);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.new .art{border-radius:14px;margin-bottom:12px}
.drop{display:block;text-align:center;padding:16px;border:1.5px dashed var(--mute);border-radius:14px;font-weight:600;font-size:14px;margin-bottom:12px;cursor:pointer}
.new textarea{min-height:90px;resize:none;margin-bottom:12px}
.cta{width:100%;padding:13px;border-radius:12px;background:var(--like);color:#fff;font-weight:700;font-size:15px;display:flex;justify-content:center;align-items:center;min-height:46px}
.cta:disabled{opacity:.75}
.ov{position:absolute;inset:0;z-index:16;background:var(--bg);display:none;flex-direction:column}
.ov.open{display:flex}
.ovh{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;border-bottom:1px solid var(--line)}
.ovb{flex:1;overflow-y:auto;padding-bottom:8px}
.bub{max-width:75%;width:fit-content;padding:9px 13px;border-radius:18px;margin:4px 14px;font-size:14px;line-height:1.35;background:var(--chip);overflow-wrap:anywhere}
.bub.me{margin-left:auto;background:var(--like);color:#fff}
.cb{display:flex;gap:10px;align-items:center;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--line)}
.cb input{background:var(--chip);border-radius:20px;padding:10px 14px}
.sh{padding:6px 16px 16px}.shp{text-align:center;margin:14px 0 18px}
.shp .av{width:96px;height:96px;margin:0 auto 12px}
.shp .rm{display:block;margin:10px auto 0;color:var(--mute);font-size:13px}
.sv2{color:var(--like);font-weight:700}.fld{position:relative;margin-bottom:10px}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:13px;font-weight:600}
.toast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.auth{position:absolute;inset:0;z-index:15;background:var(--bg);overflow-y:auto;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 56px) 28px 24px}
.auth.open{display:flex}
.tag2{text-align:center;color:var(--mute);font-size:14px;margin-bottom:24px;line-height:1.4}
.fld input.bad{border-color:var(--like)}
.err{color:var(--like);font-size:13px;min-height:20px;margin:2px 0 8px;line-height:1.35}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.swap{text-align:center;font-size:14px;margin-top:20px;color:var(--mute)}.swap button{color:var(--like);font-weight:700}
.splash{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(160deg,#ff9a3c,#ff2e63 55%,#a63cff);color:#fff;transition:opacity .5s,visibility .5s}
.splash.out{opacity:0;visibility:hidden}
.sp-mid{text-align:center}
.sp-name.wm{font-size:68px;animation:sp-up .7s .2s both}
.splash .wm i{background:#fff;box-shadow:0 0 .5em rgba(255,255,255,.9);animation:lit 1.4s .8s ease-in-out infinite}
.sp-bar{width:120px;height:3px;margin:22px auto 0;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sp-bar::after{content:"";display:block;height:100%;width:40%;background:#fff;border-radius:2px;animation:sp-load 1.1s ease-in-out infinite}
@keyframes sp-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sp-load{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@keyframes lit{50%{box-shadow:0 0 .9em #fff;transform:scaleY(1.06)}}
@media (prefers-reduced-motion:reduce){.sp-name.wm,.splash .wm i,.sp-bar::after,.spin,.heart.pop svg{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="wm"><i></i>umen</span>
    <div class="hr">
      <button id="theme" aria-label="Toggle theme"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button data-a="msgs" aria-label="Messages"><svg class="ic" viewBox="0 0 24 24"><path d="M22 3L2 10l8 3 3 8z"/><path d="M22 3L10 13"/></svg><b id="bd"></b></button>
    </div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
  <div class="ov" id="ov" role="dialog"></div>
  <div class="auth" id="auth" role="dialog" aria-label="Log in or sign up"></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="splash" id="splash"><div class="sp-mid"><div class="sp-name wm"><i></i>umen</div><div class="sp-bar"></div></div></div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Storage is full')}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ic={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',plus:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',heart:'<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>',chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6A8 8 0 1 1 21 12z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',play:'<path d="M8 5v14l11-7z" fill="currentColor"/>',back:'<path d="M15 18l-6-6 6-6"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'};
const I=n=>`<svg class="ic" viewBox="0 0 24 24">${ic[n]}</svg>`;
let ME=null,tab='home',ptab='posts',posts=[],kind='post',draft=null,draftCap='',q='',AUTH='login',lt=0,dismissed=new Set(),db;
const accts=()=>ls.get('lumen_accts',[]),acct=u=>accts().find(a=>a.user===u),prof=a=>Object.assign({},a,ls.get('lumen_prof_'+a.user,{})),fw=u=>ls.get('lumen_fw_'+u,[]),msgs=()=>ls.get('lumen_msgs',[]);
const AV=(a,x='')=>`<div class="av" style="${a&&a.photo?`background:url(${a.photo}) center/cover;`:''}${x}">${a&&a.photo?'':`<svg class="ic" viewBox="0 0 24 24" style="width:55%;height:55%">${ic.user}</svg>`}</div>`;
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
/* storage for media */
const dbOpen=()=>new Promise(r=>{try{const o=indexedDB.open('lumen',1);o.onupgradeneeded=()=>o.result.createObjectStore('p',{keyPath:'id'});o.onsuccess=()=>{db=o.result;r()};o.onerror=()=>r()}catch(e){r()}});
const dbReq=(m,s,...a)=>new Promise(r=>{if(!db)return r([]);try{const o=db.transaction('p',m).objectStore('p')[s](...a);o.onsuccess=()=>r(o.result);o.onerror=()=>r([])}catch(e){r([])}});
const savePost=p=>{const{url,...rest}=p;dbReq('readwrite','put',rest)};
const shrink=f=>new Promise(r=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1080/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>r(b),'image/jpeg',.85)};im.onerror=()=>r(null);im.src=u});
const isV=p=>p.kind==='reel'||(p.type||'').startsWith('video');
const media=(p,thumb)=>isV(p)?`<video src="${p.url}" ${thumb?'muted preload="metadata"':'controls loop playsinline'}></video>`:`<img src="${p.url}" alt="">`;
/* views */
function postHTML(p){const a=prof(acct(p.user)||{user:p.user}),on=p.likes.includes(ME.user),n=p.likes.length;
return `<article class="post" data-id="${p.id}"><div class="ph"><div style="width:36px;height:36px;display:flex">${AV(a)}</div><div><b>${esc(p.user)}</b><small>${p.kind==='reel'?'Reel · ':''}${ago(p.ts)}</small></div>${p.user===ME.user?`<button class="more" data-a="del" aria-label="Delete">${I('trash')}</button>`:''}</div><div class="art ${p.kind}" ${isV(p)?'':'data-dbl'}>${media(p)}<div class="heart"><svg viewBox="0 0 24 24">${ic.heart}</svg></div></div><div class="act"><button class="like ${on?'on':''}" data-a="like" aria-pressed="${on}" aria-label="Like">${I('heart')}</button><button data-a="cf" aria-label="Comment">${I('chat')}</button></div><div class="meta"><b>${n} ${n===1?'like':'likes'}</b>${p.cap?`<div class="cap"><b>${esc(p.user)}</b>${esc(p.cap)}</div>`:''}</div><div class="cm">${p.cm.map(c=>`<p><b>${esc(c[0])}</b>${esc(c[1])}</p>`).join('')}</div><div class="add"><input placeholder="Add a comment" aria-label="Add a comment"><button data-a="cs">Post</button></div></article>`}
const tiles=l=>`<div class="grid">${l.map(p=>`<button class="tl" data-a="open" data-id="${p.id}" aria-label="Open ${p.kind}">${media(p,1)}${p.kind==='reel'?`<span class="pl">${I('play')}</span>`:''}</button>`).join('')}</div>`;
const person=a=>{a=prof(a);const f=fw(ME.user).includes(a.user);return `<div class="pr">${AV(a)}<div class="t"><b>${esc(a.user)}</b><small>${esc(a.name||'')}</small></div><button class="fb ${f?'ghost':''}" data-a="fol" data-u="${esc(a.user)}">${f?'Following':'Follow'}</button></div>`};
function suggBox(){const l=accts().filter(a=>a.user!==ME.user&&!fw(ME.user).includes(a.user)&&!dismissed.has(a.user));if(!l.length)return'';return `<section class="sg"><div class="sgh"><b>Suggested for you</b></div><div class="sgl">${l.map(a=>{a=prof(a);return `<div class="sc"><button class="sx" data-a="dis" data-u="${esc(a.user)}" aria-label="Dismiss">×</button>${AV(a)}<b>${esc(a.user)}</b><small>${esc(a.name||'')}</small><button class="fb" data-a="fol" data-u="${esc(a.user)}">Follow</button></div>`}).join('')}</div></section>`}
function home(){const ids=[ME.user,...fw(ME.user)],l=posts.filter(p=>ids.includes(p.user)),s=suggBox();
return l.length?s+l.map(postHTML).join(''):`<div class="empty"><b>Welcome to Lumen</b><p>Share your first photo or reel, or follow people to fill your feed.</p><button class="fb" data-tab="plus">Create post</button></div>${s}`}
function resHTML(){const k=q.toLowerCase(),ppl=k?accts().filter(a=>a.user!==ME.user&&(a.user+(prof(a).name||'')).toLowerCase().includes(k)):[],l=posts.filter(p=>!k||(p.cap+p.user).toLowerCase().includes(k));
return ppl.map(person).join('')+(l.length?tiles(l):`<div class="empty"><b>${k?'No results':'Nothing to explore yet'}</b><p>${k?'Try a different name or word.':'Posts and reels shared on Lumen appear here.'}</p></div>`)}
const explore=()=>`<div class="search"><input id="q" value="${esc(q)}" placeholder="Search people and posts" aria-label="Search"></div><div id="res">${resHTML()}</div>`;
function create(){const pv=draft?`<div class="art ${kind}">${media(draft)}</div>`:'',rl=kind==='reel';
return `<div class="new"><div class="seg"><button data-a="kind" data-v="post" aria-pressed="${!rl}">Post</button><button data-a="kind" data-v="reel" aria-pressed="${rl}">Reel</button></div>${pv}<label class="drop">${draft?'Choose a different file':rl?'Choose a video from gallery':'Choose a photo or video from gallery'}<input type="file" id="gf" accept="${rl?'video/*':'image/*,video/*'}" hidden></label><textarea id="cp" placeholder="Write a caption…" aria-label="Caption">${esc(draftCap)}</textarea><button class="cta" data-a="share">Share ${kind}</button></div>`}
function profile(){const mine=posts.filter(p=>p.user===ME.user),po=mine.filter(p=>p.kind==='post'),re=mine.filter(p=>p.kind==='reel'),flw=accts().filter(a=>fw(a.user).includes(ME.user)).length,l=ptab==='reels'?re:po;
return `<div class="prof"><div class="top"><div class="ring ${ME.photo?'':'seen'}">${AV(ME)}</div><div class="stats"><div><b>${po.length}</b><span>posts</span></div><div><b>${flw}</b><span>followers</span></div><div><b>${fw(ME.user).length}</b><span>following</span></div></div></div><h2>${esc(ME.name)}</h2><p>@${esc(ME.user)}${ME.bio?'<br>'+esc(ME.bio).replace(/\n/g,'<br>'):''}</p><div class="btns"><button class="pri" data-a="edit">Edit profile</button><button data-a="out">Log out</button></div></div><div class="ptabs"><button data-a="pt" data-v="posts" aria-pressed="${ptab==='posts'}">Posts ${po.length}</button><button data-a="pt" data-v="reels" aria-pressed="${ptab==='reels'}">Reels ${re.length}</button></div>${l.length?tiles(l):`<div class="empty"><b>No ${ptab} yet</b><p>Add one from your gallery.</p><button class="fb" data-a="mk" data-v="${ptab==='reels'?'reel':'post'}">Add ${ptab==='reels'?'reel':'post'}</button></div>`}`}
function nav(){$('#nav').innerHTML=[['home','Home'],['search','Explore'],['plus','Create'],['user','Profile']].map(([k,l])=>`<button data-tab="${k}" aria-label="${l}" aria-current="${tab===k}">${I(k)}</button>`).join('')}
function render(){if(!ME)return;nav();const m=$('#main'),y=m.scrollTop;m.innerHTML={home,search:explore,plus:create,user:profile}[tab]();if(tab==='home')m.scrollTop=y;badge()}
/* messages */
function convs(){const map={};msgs().filter(x=>x.from===ME.user||x.to===ME.user).forEach(x=>{const o=x.from===ME.user?x.to:x.from;(map[o]=map[o]||[]).push(x)});return Object.entries(map).map(([o,l])=>({o,last:l[l.length-1],un:l.filter(x=>x.to===ME.user&&x.from!==ME.user&&!x.read).length})).sort((a,b)=>b.last.ts-a.last.ts)}
function badge(){const n=ME?convs().reduce((s,c)=>s+(c.o===ME.user?0:c.un),0):0;$('#bd').textContent=n||''}
const ov=h=>{$('#ov').innerHTML=h;$('#ov').classList.add('open')};
const who=o=>o===ME.user?ME:prof(acct(o)||{user:o});
const row=(o,t,s,x='')=>`<button class="pr" data-a="thread" data-u="${esc(o)}">${AV(who(o))}<div class="t"><b>${o===ME.user?'Notes to self':esc(o)}</b><small>${t}</small></div>${x}</button>`;
function inbox(){const c=convs();ov(`<div class="ovh"><button data-a="closeov" aria-label="Close">${I('back')}</button><b>Messages</b><button data-a="newm" aria-label="New message">${I('edit')}</button></div><div class="ovb">${c.length?c.map(x=>row(x.o,esc(x.last.text),0,x.un&&x.o!==ME.user?'<i class="dot"></i>':'')).join(''):'<div class="empty"><b>No messages yet</b><p>Tap the compose icon to start a conversation.</p></div>'}</div>`);badge()}
function newm(){const o=accts().filter(a=>a.user!==ME.user);ov(`<div class="ovh"><button data-a="msgs" aria-label="Back">${I('back')}</button><b>New message</b><span style="width:26px"></span></div><div class="ovb">${row(ME.user,'Save notes and reminders')}${o.map(a=>row(a.user,esc(prof(a).name||''))).join('')}${o.length?'':'<div class="empty"><p>Other people appear here once they create an account on this device.</p></div>'}</div>`)}
function thread(o){const all=msgs();let ch=0;all.forEach(x=>{if(x.to===ME.user&&x.from===o&&o!==ME.user&&!x.read){x.read=true;ch=1}});if(ch)ls.set('lumen_msgs',all);const l=all.filter(x=>(x.from===ME.user&&x.to===o)||(x.from===o&&x.to===ME.user));
ov(`<div class="ovh"><button data-a="msgs" aria-label="Back">${I('back')}</button><b>${o===ME.user?'Notes to self':'@'+esc(o)}</b><span style="width:26px"></span></div><div class="ovb" id="tb">${l.length?l.map(x=>`<div class="bub ${x.from===ME.user?'me':''}">${esc(x.text)}</div>`).join(''):'<div class="empty"><p>No messages yet. Say hello.</p></div>'}</div><div class="cb"><input id="mi" placeholder="Message…" aria-label="Message" autocomplete="off"><button data-a="send" data-u="${esc(o)}">Send</button></div>`);const t=$('#tb');t.scrollTop=t.scrollHeight;badge()}
function editor(){ov(`<div class="ovh"><button data-a="closeov">Cancel</button><b>Edit profile</b><button class="sv2" data-a="done">Done</button></div><div class="ovb"><div class="sh"><div class="shp">${AV(ME)}<label class="fb">${ME.photo?'Change photo':'Add photo'}<input type="file" accept="image/*" id="pf" hidden></label>${ME.photo?'<button class="rm" data-a="rmp">Remove photo</button>':''}</div><div class="fld"><input id="en" value="${esc(ME.name)}" maxlength="40" placeholder="Name" aria-label="Name"></div><div class="fld"><input id="eb" value="${esc(ME.bio||'')}" maxlength="120" placeholder="Bio" aria-label="Bio"></div></div></div>`)}
const keep=fn=>{const n=$('#en').value,b=$('#eb').value;fn();editor();$('#en').value=n;$('#eb').value=b};
const saveProf=()=>ls.set('lumen_prof_'+ME.user,{name:ME.name,bio:ME.bio||'',photo:ME.photo||''});
/* auth */
function authView(){const L=AUTH==='login',fl=(n,t,p,ac)=>`<div class="fld"><input name="${n}" type="${t}" placeholder="${p}" autocomplete="${ac}" aria-label="${p}">${n==='pw'?'<button type="button" class="eye" data-a="eye">Show</button>':''}</div>`;
return `<div class="wm big"><i></i>umen</div><p class="tag2">${L?'Log in to see what your friends are sharing.':'Sign up to share photos and reels with friends.'}</p><form id="af" novalidate>${L?fl('id','text','Username or email','username'):fl('email','email','Email','email')+fl('name','text','Full name','name')+fl('user','text','Username','username')}${fl('pw','password','Password',L?'current-password':'new-password')}<div class="err" id="err" role="alert"></div><button class="cta" type="submit">${L?'Log in':'Sign up'}</button></form><div class="swap">${L?'New to Lumen?':'Have an account?'} <button data-a="swap">${L?'Sign up':'Log in'}</button></div>`}
function openAuth(m){AUTH=m||'login';const a=$('#auth');a.innerHTML=authView();a.scrollTop=0;a.classList.add('open')}
function enter(a,msg){const b=$('.cta');b.disabled=true;b.innerHTML='<i class="spin"></i>';setTimeout(()=>{ME=prof(a);ls.set('lumen_session',a.user);dismissed=new Set();draft=null;draftCap='';tab='home';$('#auth').classList.remove('open');render();$('#main').scrollTop=0;toast(msg)},900)}
function doAuth(){const f=$('#af'),v=n=>(f.elements[n]?f.elements[n].value:'').trim(),er=$('#err'),pw=f.elements.pw.value;
 const fail=(m,n)=>{er.textContent=m;if(f.elements[n]){f.elements[n].classList.add('bad');f.elements[n].focus()}};
 f.querySelectorAll('input').forEach(i=>i.classList.remove('bad'));er.textContent='';
 if(AUTH==='login'){const id=v('id').toLowerCase();if(!id)return fail('Enter your username or email.','id');if(!pw)return fail('Enter your password.','pw');
  const a=accts().find(x=>x.user===id||x.email.toLowerCase()===id);
  if(!a)return fail('We couldn’t find an account with that username or email.','id');
  if(a.pw!==pw)return fail('Wrong password. Try again.','pw');
  return enter(a,'Welcome back, '+prof(a).name.split(' ')[0])}
 const em=v('email'),nm=v('name'),us=v('user').toLowerCase();
 if(!/^\S+@\S+\.\S+$/.test(em))return fail('Enter a valid email address.','email');
 if(nm.length<2)return fail('Enter your full name.','name');
 if(!/^[a-z0-9._]{3,20}$/.test(us))return fail('Usernames use 3–20 letters, numbers, periods or underscores.','user');
 if(acct(us))return fail('@'+us+' is taken. Try @'+us+'.'+(Math.floor(Math.random()*90)+10)+' instead.','user');
 if(accts().some(x=>x.email.toLowerCase()===em.toLowerCase()))return fail('That email already has an account. Log in instead.','email');
 if(pw.length<6)return fail('Password must be at least 6 characters.','pw');
 const a={user:us,name:nm,email:em,pw};ls.set('lumen_accts',[...accts(),a]);enter(a,'Welcome to Lumen, @'+us)}
/* actions */
const pOf=el=>posts.find(p=>p.id===el.closest('[data-id]').dataset.id);
function likeP(p,force){const on=force||!p.likes.includes(ME.user);p.likes=p.likes.filter(u=>u!==ME.user);if(on)p.likes.push(ME.user);savePost(p);document.querySelectorAll(`.post[data-id="${p.id}"]`).forEach(el=>{const b=el.querySelector('.like'),n=p.likes.length;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);el.querySelector('.meta b').textContent=n+(n===1?' like':' likes')})}
document.addEventListener('submit',e=>{if(e.target.id==='af'){e.preventDefault();doAuth()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(t.closest&&t.closest('.add'))t.nextElementSibling.click();if(t.id==='mi')$('[data-a=send]').click()});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#res').innerHTML=resHTML()}});
document.addEventListener('click',e=>{
 const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();$('#main').scrollTop=0;return}
 const b=e.target.closest('[data-a]'),dz=e.target.closest('[data-dbl]');
 if(!b&&dz&&ME){const n=Date.now();if(n-lt<320){likeP(pOf(dz),true);const h=dz.querySelector('.heart');h.classList.remove('pop');void h.offsetWidth;h.classList.add('pop')}lt=n;return}
 if(!b)return;const a=b.dataset.a,u=b.dataset.u;
 if(a==='swap')return openAuth(AUTH==='login'?'signup':'login');
 if(a==='eye'){const i=b.previousElementSibling,s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show';return}
 if(!ME)return;
 if(a==='out'){ME=null;ls.del('lumen_session');badge();openAuth();return toast('Logged out')}
 if(a==='like')return likeP(pOf(b));
 if(a==='cf')return b.closest('.post').querySelector('.add input').focus();
 if(a==='cs'){const p=pOf(b),i=b.previousElementSibling,v=i.value.trim();if(!v)return;p.cm.push([ME.user,v]);savePost(p);b.closest('.post').querySelector('.cm').insertAdjacentHTML('beforeend',`<p><b>${esc(ME.user)}</b>${esc(v)}</p>`);i.value='';return}
 if(a==='del'){if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Tap again to delete';return}const p=pOf(b);posts=posts.filter(x=>x!==p);dbReq('readwrite','delete',p.id);URL.revokeObjectURL(p.url);$('#ov').classList.remove('open');render();return toast('Deleted')}
 if(a==='open'){const p=pOf(b);return ov(`<div class="ovh"><button data-a="closeov" aria-label="Back">${I('back')}</button><b>${p.kind==='reel'?'Reel':'Post'}</b><span style="width:26px"></span></div><div class="ovb">${postHTML(p)}</div>`)}
 if(a==='closeov'){$('#ov').classList.remove('open');$('#ov').innerHTML='';return render()}
 if(a==='fol'){const l=fw(ME.user),i=l.indexOf(u);i<0?l.push(u):l.splice(i,1);ls.set('lumen_fw_'+ME.user,l);tab==='search'?$('#res').innerHTML=resHTML():render();return toast(i<0?'Following @'+u:'Unfollowed @'+u)}
 if(a==='dis'){dismissed.add(u);return render()}
 if(a==='pt'){ptab=b.dataset.v;return render()}
 if(a==='mk'){kind=b.dataset.v;tab='plus';return render()}
 if(a==='kind'){const v=b.dataset.v;draftCap=$('#cp').value;if(draft&&v==='reel'&&!isV(draft))draft=null;if(draft)draft.kind=v;kind=v;return render()}
 if(a==='share'){draftCap=$('#cp').value.trim();if(!draft)return toast('Choose a file from your gallery first');const p={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),user:ME.user,kind,blob:draft.blob,type:draft.type,url:draft.url,cap:draftCap,ts:Date.now(),likes:[],cm:[]};posts.unshift(p);savePost(p);const k=kind;draft=null;draftCap='';if(k==='reel'){ptab='reels';tab='user'}else{ptab='posts';tab='home'}render();$('#main').scrollTop=0;return toast(k==='reel'?'Reel shared':'Post shared')}
 if(a==='msgs')return inbox();
 if(a==='newm')return newm();
 if(a==='thread')return thread(u);
 if(a==='send'){const i=$('#mi'),v=i.value.trim();if(!v)return;const all=msgs();all.push({id:Date.now()+Math.random(),from:ME.user,to:u,text:v,ts:Date.now(),read:u===ME.user});ls.set('lumen_msgs',all);thread(u);$('#mi').focus();return}
 if(a==='edit')return editor();
 if(a==='rmp')return keep(()=>{ME.photo='';saveProf()});
 if(a==='done'){const n=$('#en').value.trim();if(n)ME.name=n;ME.bio=$('#eb').value.trim();saveProf();$('#ov').classList.remove('open');$('#ov').innerHTML='';render();toast('Profile updated')}
});
document.addEventListener('change',async e=>{const t=e.target,f=t.files&&t.files[0];if(!f)return;
 if(t.id==='gf'){const v=f.type.startsWith('video');if(kind==='reel'&&!v)return toast('Reels need a video');if(v&&f.size>40e6)return toast('Video must be under 40 MB');draftCap=$('#cp').value;const blob=v?f:await shrink(f);if(!blob)return toast('Could not read that file');if(draft)URL.revokeObjectURL(draft.url);draft={blob,type:v?f.type:'image/jpeg',url:URL.createObjectURL(blob),kind};render()}
 if(t.id==='pf'){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=256,m=Math.min(im.width,im.height);c.width=c.height=s;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);keep(()=>{ME.photo=c.toDataURL('image/jpeg',.82);saveProf()})};im.src=r.result};r.readAsDataURL(f)}});
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
(async()=>{await dbOpen();const all=await dbReq('readonly','getAll');posts=(all||[]).filter(p=>p.blob).map(p=>({...p,url:URL.createObjectURL(p.blob)})).sort((x,y)=>y.ts-x.ts);
 const s=ls.get('lumen_session'),a=s&&acct(s);if(a){ME=prof(a);render()}
 setTimeout(()=>{if(!a)openAuth();$('#splash').classList.add('out')},2400)})();
</script>
</body>
</html>
